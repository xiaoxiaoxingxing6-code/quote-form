<!-- SUPER LAB 詢價表單 — 靜態前端頁面 -->
<!-- 這支檔案要上傳到 GitHub Pages（或其他靜態網站服務），不是給 Google Apps Script 用的。 -->
<!-- 上傳前請先把下面「設定區」的 LIFF_ID 跟 GAS_ENDPOINT 換成你自己的，詳見安裝手冊。 -->
<!-- 表單題目已對照官網 https://www.superlab.com.tw/connection/ 逐題核對，題目、選項、必填設定皆與官網一致。 -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>線上詢價 - 台美檢驗</title>
  <meta property="og:title" content="線上詢價 - 台美檢驗">
  <meta property="og:description" content="填寫線上詢價表單，快速取得檢驗報價服務。">
  <meta property="og:image" content="https://xiaoxiaoxingxing6-code.github.io/quote-form/og-image.png">
  <meta property="og:url" content="https://xiaoxiaoxingxing6-code.github.io/quote-form/index.html">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <style>
    :root{
      --pink-1:#f7e3e6;
      --pink-2:#e8a9b4;
      --brown-1:#5c3a2e;
      --brown-2:#8a5a44;
      --bg:#fdf6f4;
      --card:#ffffff;
      --text:#3a2a24;
      --muted:#8a7570;
      --danger:#c0392b;
      --radius:16px;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      padding-bottom:32px;
    }
    header{
      background:linear-gradient(135deg,var(--pink-1),#fff);
      padding:28px 20px 20px;
      border-bottom:3px solid var(--pink-2);
    }
    header h1{
      margin:0 0 4px;
      font-size:20px;
      color:var(--brown-1);
    }
    header p{
      margin:0;
      font-size:13px;
      color:var(--muted);
    }
    #profile{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:14px;
      font-size:13px;
      color:var(--brown-2);
    }
    #profile img{
      width:32px;height:32px;border-radius:50%;
      border:2px solid var(--pink-2);
    }
    main{padding:18px 20px;}
    .card{
      background:var(--card);
      border-radius:var(--radius);
      padding:20px;
      box-shadow:0 2px 10px rgba(92,58,46,0.08);
    }
    .field{margin-bottom:16px;}
    .field:last-child{margin-bottom:0;}
    .field.hidden{display:none;}
    label{
      display:block;
      font-size:13px;
      font-weight:600;
      color:var(--brown-1);
      margin-bottom:6px;
    }
    label .required{color:var(--danger);margin-left:2px;}
    label .hint{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:3px;}
    label .hint.hidden{display:none;}
    .subscribed-note{background:#e3f3e6;color:#2e7d4f;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;}
    input[type=text],input[type=tel],input[type=email],select,textarea{
      width:100%;
      padding:12px 14px;
      border:1.5px solid #e6d5d0;
      border-radius:10px;
      font-size:15px;
      color:var(--text);
      background:#fffdfc;
      appearance:none;
      -webkit-appearance:none;
    }
    input:focus,select:focus,textarea:focus{
      outline:none;
      border-color:var(--pink-2);
      box-shadow:0 0 0 3px rgba(232,169,180,0.35);
    }
    textarea{resize:vertical;min-height:70px;}
    .checkbox-group{
      display:flex;
      flex-wrap:wrap;
      gap:8px 16px;
      padding:10px 12px;
      border:1.5px solid #e6d5d0;
      border-radius:10px;
      background:#fffdfc;
    }
    .checkbox-group .opt{
      display:flex;
      align-items:center;
      gap:6px;
      font-size:14px;
      font-weight:400;
      color:var(--text);
    }
    .checkbox-group input[type=checkbox],.checkbox-group input[type=radio]{
      width:17px;height:17px;
      accent-color:var(--pink-2);
      flex:none;
    }
    .error-text{
      color:var(--danger);
      font-size:12px;
      margin-top:5px;
      display:none;
    }
    .field.invalid input,.field.invalid select,.field.invalid .checkbox-group{border-color:var(--danger);}
    .field.invalid .error-text{display:block;}
    .submit-bar{margin-top:20px;}
    button#submitBtn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      background:var(--brown-1);
      color:#fff;
      font-size:16px;
      font-weight:700;
      letter-spacing:0.5px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    button#submitBtn:disabled{opacity:0.6;}
    .spinner{
      width:16px;height:16px;
      border:2px solid rgba(255,255,255,0.4);
      border-top-color:#fff;
      border-radius:50%;
      animation:spin 0.7s linear infinite;
      display:none;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    .banner{
      font-size:12px;
      color:var(--muted);
      text-align:center;
      margin-top:12px;
    }
    #resultScreen{
      position:fixed;inset:0;
      background:var(--bg);
      display:none;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:32px;
      z-index:10;
    }
    #resultScreen.show{display:flex;}
    #resultScreen .icon{
      width:64px;height:64px;
      border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:32px;
      margin-bottom:16px;
    }
    #resultScreen.success .icon{background:#e3f3e6;color:#2e7d4f;}
    #resultScreen.fail .icon{background:#fbe4e1;color:var(--danger);}
    #resultScreen h2{margin:0 0 8px;font-size:18px;color:var(--brown-1);}
    #resultScreen p{margin:0 0 20px;font-size:14px;color:var(--muted);}
    #resultScreen button{
      padding:12px 28px;
      border:none;
      border-radius:10px;
      background:var(--brown-1);
      color:#fff;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
    }
    #resultScreen button.secondary{
      background:transparent;
      color:var(--brown-1);
      border:1.5px solid var(--brown-1);
      margin-top:10px;
    }
    #liffDebug{
      display:none;margin-top:16px;font-size:11.5px;color:#c0392b;
      background:#fbe4e1;border-radius:8px;padding:8px 10px;max-width:280px;word-break:break-all;
    }
    .header-top{
      display:flex;
      align-items:flex-start;
      gap:12px;
    }
    .header-top img.logo{
      width:40px;
      height:auto;
      flex:none;
      margin-top:2px;
    }
  </style>
</head>

        <div class="error-text">請選擇先生/小姐</div>
      </div>

      <div class="field" id="field-bizCategories">
        <label>公司營業項目｜複選<span class="required">*</span></label>
        <div class="checkbox-group" id="bizCategoriesGroup"></div>
        <div class="error-text">請至少勾選一項公司營業項目</div>
      </div>

      <div class="field" id="field-region">
        <label>業務區域<span class="required">*</span></label>
        <select id="region">
          <option value="">請選擇</option>
        </select>
        <div class="error-text">請選擇業務區域</div>
      </div>

      <div class="field" id="field-phone">
        <label>連絡電話/分機<span class="required">*</span></label>
        <input type="tel" id="phone" autocomplete="tel" placeholder="例如：02-12345678#123">
        <div class="error-text">請填寫正確的連絡電話/分機</div>
      </div>

      <div class="field" id="field-email">
        <label>您的 Email<span class="required">*</span></label>
        <input type="email" id="email" autocomplete="email" placeholder="請輸入您的 Email">
        <div class="error-text">請填寫正確的 Email</div>
      </div>

      <div class="field" id="field-subject">
        <label>信件主旨<span class="required">*</span></label>
        <select id="subject">
          <option value="">請選擇</option>
        </select>
        <div class="error-text">請選擇信件主旨</div>
      </div>

      <div class="field" id="field-productName">
        <label>送檢驗的產品「名稱」或產品類別<span class="required">*</span></label>
        <input type="text" id="productName" placeholder="請輸入產品名稱或類別">
        <div class="error-text">請填寫送檢驗的產品「名稱」或產品類別</div>
      </div>

      <div class="field" id="field-message">
        <label>請輸入您的訊息<span class="required">*</span></label>
        <textarea id="message" placeholder="請輸入您想詢問或說明的內容"></textarea>
        <div class="error-text">請輸入您的訊息</div>
      </div>

      <div class="field" id="field-subscribe">
        <label>訂閱台美檢驗電子報，獲取檢驗訊息與優惠、市場趨勢法規與研討會資訊，若勾選訂閱表示同意服務條款與隱私權政策<span class="required">*</span></label>
        <select id="subscribe">
          <option value="">請選擇</option>
          <option value="訂閱">訂閱</option>
          <option value="不訂閱">不訂閱</option>
        </select>
        <div class="error-text">請選擇是否訂閱電子報</div>
      </div>

      <div class="field hidden" id="field-subscribeCategories">
        <label>電子報訂閱項目<span class="hint">選擇「訂閱」時才需要填寫</span></label>
        <div class="checkbox-group" id="subscribeCategoriesGroup"></div>
        <div class="error-text">請至少勾選一項電子報訂閱項目</div>
      </div>

      <div class="field hidden" id="field-alreadySubscribedNote">
        <div class="subscribed-note">✓ 您已訂閱過電子報，本次不需要重新填寫</div>
      </div>

      <div class="submit-bar">
        <button type="submit" id="submitBtn">
          <span class="spinner" id="spinner"></span>
          <span id="submitLabel">送出詢問</span>
        </button>
        <p class="banner">送出後專人將於 1-2 個工作天內與您聯繫</p>
      </div>
    </form>
  </main>

  <div id="resultScreen">
    <div class="icon" id="resultIcon">✓</div>
    <h2 id="resultTitle">已送出，謝謝！</h2>
    <p id="resultMessage">我們已收到您的詢價資訊。</p>
    <button id="closeBtn">關閉視窗</button>
    <button class="secondary" id="retryBtn" style="display:none;">重新填寫</button>
    <p id="liffDebug"></p>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // ========== 設定區：換成你自己的值 ==========
    // 1. LIFF ID：LINE Developers Console → 你的 LINE Login Channel → LIFF 分頁
    const LIFF_ID = '2011606713-75W8Q3uj';
    // 2. Apps Script 部署後的網址（結尾是 /exec）
    const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbw0cyomFhoUoBMhQKxp3qL3dX6Btl4vayOQ4I3VZV1TrFlaEA5EORr5MpdWa3j8iB6inQ/exec';

    // 以下題目與選項均對照官網 https://www.superlab.com.tw/connection/ 逐字核對，
    // 如果官網表單日後更新題目/選項，要記得回來同步修改這裡（跟 Code.gs 裡的驗證邏輯要一起改）。
    const BIZ_CATEGORIES = ['食品', '保健食品', '化粧品', '環境', '藥品', '醫療器材', '化學品', '再生醫療', '其他'];
    const REGIONS = [
      '北區（台北、新北、桃園、新竹、宜蘭）',
      '中區 A（苗栗、台中市）',
      '中區 B（南投、彰化、雲林）',
      '南區 A（嘉義、台南、花蓮）',
      '南區 B（高雄、屏東、台東）',
      '其他區',
    ];
    const SUBJECTS = ['1. 報價服務', '2. 特殊實驗設計', '3. 行銷合作提案', '4. 商標授權申請', '5. 其他事務'];
    const NEWSLETTER_CATEGORIES = ['食品', '健康食品', '化粧品', '中西藥品', '醫學', '醫療器材', '化學品/農藥', '環境/水質', '抗菌/抗病毒', '實驗室能力試驗'];
    // 「客戶類型」是官網沒有的題目，因應現場反饋（個人戶沒有公司名稱/統一編號可填）新增。
    // 選「個人戶」時，公司名稱、統一編號會自動代入「個人戶」文字並隱藏，不用手動填寫。
    const CUSTOMER_TYPES = ['公司戶', '個人戶'];
    // ============================================

    let userProfile = { userId: '', displayName: '' };

    function showLiffDebug(label, err) {
      const el = document.getElementById('liffDebug');
      const detail = err ? (err.message || err.code || JSON.stringify(err)) : '';
      el.textContent = '⚠ ' + label + (detail ? '：' + detail : '');
      el.style.display = 'block';
      console.error(label, err);
    }

    // ---------- 建立下拉選單與複選方塊 ----------
    function fillSelect(selectEl, options) {
      options.forEach((opt) => {
        const el = document.createElement('option');
        el.value = opt;
        el.textContent = opt;
        selectEl.appendChild(el);
      });
    }

    function fillCheckboxGroup(containerEl, groupName, options) {
      options.forEach((opt, i) => {
        const id = groupName + '_' + i;
        const wrap = document.createElement('label');
        wrap.className = 'opt';
        wrap.setAttribute('for', id);
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.id = id;
        cb.name = groupName;
        cb.value = opt;
        wrap.appendChild(cb);
        wrap.appendChild(document.createTextNode(opt));
        containerEl.appendChild(wrap);
      });
    }

    // 單選用（例如客戶類型：公司戶／個人戶只能擇一），寫法跟複選方塊很像，差在 type 是 radio。
    function fillRadioGroup(containerEl, groupName, options) {
      options.forEach((opt, i) => {
        const id = groupName + '_' + i;
        const wrap = document.createElement('label');
        wrap.className = 'opt';
        wrap.setAttribute('for', id);
        const rb = document.createElement('input');
        rb.type = 'radio';
        rb.id = id;
        rb.name = groupName;
        rb.value = opt;
        wrap.appendChild(rb);
        wrap.appendChild(document.createTextNode(opt));
        containerEl.appendChild(wrap);
      });
    }

    fillSelect(document.getElementById('region'), REGIONS);
    fillSelect(document.getElementById('subject'), SUBJECTS);
    fillCheckboxGroup(document.getElementById('bizCategoriesGroup'), 'bizCategories', BIZ_CATEGORIES);
    fillCheckboxGroup(document.getElementById('subscribeCategoriesGroup'), 'subscribeCategories', NEWSLETTER_CATEGORIES);
    fillRadioGroup(document.getElementById('customerTypeGroup'), 'customerType', CUSTOMER_TYPES);

    function getCheckedValues(groupName) {
      return Array.from(document.querySelectorAll('input[name="' + groupName + '"]:checked')).map((el) => el.value);
    }

    function getCheckedValue(groupName) {
      const el = document.querySelector('input[name="' + groupName + '"]:checked');
      return el ? el.value : '';
    }

    // 「訂閱台美檢驗電子報」選「訂閱」才顯示、並要求勾選電子報訂閱項目；選「不訂閱」就隱藏並視為不需填寫。
    // 抽成獨立函式，這樣「使用者手動切換」跟「帶入上次答案後自動同步畫面」都能共用同一套邏輯。
    const subscribeSelect = document.getElementById('subscribe');
    const subscribeField = document.getElementById('field-subscribe');
    const subscribeCategoriesField = document.getElementById('field-subscribeCategories');
    const alreadySubscribedNote = document.getElementById('field-alreadySubscribedNote');
    function updateSubscribeVisibility() {
      const show = subscribeSelect.value === '訂閱';
      subscribeCategoriesField.classList.toggle('hidden', !show);
      if (!show) subscribeCategoriesField.classList.remove('invalid');
    }
    subscribeSelect.addEventListener('change', updateSubscribeVisibility);

    // 「客戶類型」選「個人戶」時，公司名稱／統一編號隱藏起來、不用填也不會擋在必填檢查；
    // 選「公司戶」時才顯示這兩欄，並要求正常填寫。同樣抽成獨立函式供帶入上次答案時共用。
    const companyNameField = document.getElementById('field-companyName');
    const taxIdField = document.getElementById('field-taxId');
    const nameHint = document.getElementById('nameHint');
    function updateCustomerTypeVisibility() {
      const isCompany = getCheckedValue('customerType') === '公司戶';
      companyNameField.classList.toggle('hidden', !isCompany);
      taxIdField.classList.toggle('hidden', !isCompany);
      if (!isCompany) {
        companyNameField.classList.remove('invalid');
        taxIdField.classList.remove('invalid');
      }
      // 個人戶容易誤填「陳先生」「何小姐」這種稱呼進姓名欄，這裡提醒要填完整全名
      nameHint.classList.toggle('hidden', isCompany);
    }
    document.getElementById('customerTypeGroup').addEventListener('change', updateCustomerTypeVisibility);

    // ---------- 帶入上次填過的資料（只帶「身份資料」類題目，詢價內容每次都要重填） ----------
    function setCheckedValues(groupName, valuesStr) {
      const values = String(valuesStr || '').split('、').map((s) => s.trim()).filter(Boolean);
      document.querySelectorAll('input[name="' + groupName + '"]').forEach((el) => {
        el.checked = values.indexOf(el.value) !== -1;
      });
    }

    function prefillFromPreviousAnswers(userId) {
      fetch(GAS_ENDPOINT + '?action=lookup&userId=' + encodeURIComponent(userId), { method: 'GET' })
        .then((res) => res.json())
        .then((data) => {
          if (!data || !data.found) return;
          setCheckedValues('customerType', data.customerType);
          document.getElementById('companyName').value = data.companyName === '個人戶' ? '' : (data.companyName || '');
          document.getElementById('taxId').value = data.taxId === '個人戶' ? '' : (data.taxId || '');
          document.getElementById('name').value = data.name || '';
          document.getElementById('title').value = data.title || '';
          setCheckedValues('bizCategories', data.bizCategories);
          document.getElementById('region').value = data.region || '';
          document.getElementById('phone').value = data.phone || '';
          document.getElementById('email').value = data.email || '';

          // 電子報訂閱題目規則比較特別：
          // 上次選「訂閱」→ 這題整個不用再問，直接帶入上次的訂閱項目、隱藏題目、改顯示一行提醒文字
          // 上次選「不訂閱」、或是第一次填 → 都要空白讓使用者重新選一次，不預帶值
          //（因為「不訂閱」不代表以後都不訂閱，每次都給機會讓他改變心意；只有已經訂閱過的人不用再被問）
          const wasSubscribed = data.subscribe === '訂閱' && data.subscribeCategories && String(data.subscribeCategories).trim() !== '';
          if (wasSubscribed) {
            subscribeSelect.value = '訂閱';
            setCheckedValues('subscribeCategories', data.subscribeCategories);
            subscribeField.classList.add('hidden');
            subscribeCategoriesField.classList.add('hidden');
            alreadySubscribedNote.classList.remove('hidden');
          } else {
            subscribeSelect.value = '';
            setCheckedValues('subscribeCategories', '');
          }

          // 帶完值後，手動同步一次「客戶類型」欄位控制的顯示/隱藏邏輯（訂閱欄位上面已經處理過了）
          updateCustomerTypeVisibility();
        })
        .catch((err) => {
          // 帶入失敗不影響正常填表，靜默記錄就好，不打擾使用者
          console.error('帶入上次填寫資料失敗：', err);
        });
    }

    // ---------- LIFF 初始化 ----------
    // 這個頁面是真正的靜態網站（不是 Apps Script serve 出來的），本身就是最上層視窗，
    // 不會再被任何東西包住，liff.init() 應該可以正常運作。
    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        return liff.getProfile();
      })
      .then((profile) => {
        if (!profile) return;
        userProfile = { userId: profile.userId, displayName: profile.displayName };
        document.getElementById('profileImg').src = profile.pictureUrl || '';
        document.getElementById('profileName').textContent = profile.displayName + ' 您好';
        document.getElementById('profile').style.display = 'flex';
        // 帶入這位 LINE 使用者上次填過的身份資料，省得每次都要重填一樣的內容
        prefillFromPreviousAnswers(profile.userId);
      })
      .catch((err) => {
        // 不在 LINE App 內開啟時（例如直接用瀏覽器測試）仍允許填表，只是不會帶入 LINE 資料
        showLiffDebug('LIFF 初始化失敗', err);
      });

    // ---------- 表單驗證與送出 ----------
    const form = document.getElementById('quoteForm');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const submitLabel = document.getElementById('submitLabel');

    function setFieldError(id, invalid) {
      document.getElementById('field-' + id).classList.toggle('invalid', invalid);
    }

    function validate() {
      const customerType = getCheckedValue('customerType');
      const isCompany = customerType === '公司戶';
      const companyName = document.getElementById('companyName').value.trim();
      const taxId = document.getElementById('taxId').value.trim();
      const name = document.getElementById('name').value.trim();
      const title = document.getElementById('title').value;
      const bizCategories = getCheckedValues('bizCategories');
      const region = document.getElementById('region').value;
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const subject = document.getElementById('subject').value;
      const productName = document.getElementById('productName').value.trim();
      const message = document.getElementById('message').value.trim();
      const subscribe = document.getElementById('subscribe').value;
      const subscribeCategories = getCheckedValues('subscribeCategories');

      const customerTypeOk = customerType !== '';
      // 個人戶不用填公司名稱/統一編號，這兩欄自動視為已通過檢查
      const companyNameOk = !isCompany || companyName.length > 0;
      const taxIdOk = !isCompany || /^\d{8}$/.test(taxId);
      const nameOk = name.length > 0;
      const titleOk = title !== '';
      const bizCategoriesOk = bizCategories.length > 0;
      const regionOk = region !== '';
      const phoneOk = /^[0-9+#\-\s]{8,20}$/.test(phone);
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      const subjectOk = subject !== '';
      const productNameOk = productName.length > 0;
      const messageOk = message.length > 0;
      const subscribeOk = subscribe !== '';
      // 電子報訂閱項目只有在選「訂閱」時才要求必填，跟官網邏輯一致
      const subscribeCategoriesOk = subscribe !== '訂閱' || subscribeCategories.length > 0;

      setFieldError('customerType', !customerTypeOk);
      setFieldError('companyName', isCompany && !companyNameOk);
      setFieldError('taxId', isCompany && !taxIdOk);
      setFieldError('name', !nameOk);
      setFieldError('title', !titleOk);
      setFieldError('bizCategories', !bizCategoriesOk);
      setFieldError('region', !regionOk);
      setFieldError('phone', !phoneOk);
      setFieldError('email', !emailOk);
      setFieldError('subject', !subjectOk);
      setFieldError('productName', !productNameOk);
      setFieldError('message', !messageOk);
      setFieldError('subscribe', !subscribeOk);
      setFieldError('subscribeCategories', !subscribeCategoriesOk);

      return customerTypeOk && companyNameOk && taxIdOk && nameOk && titleOk && bizCategoriesOk && regionOk &&
        phoneOk && emailOk && subjectOk && productNameOk && messageOk && subscribeOk && subscribeCategoriesOk;
    }

    function buildPayload() {
      const subscribe = document.getElementById('subscribe').value;
      const customerType = getCheckedValue('customerType');
      const isCompany = customerType === '公司戶';
      return {
        userId: userProfile.userId,
        displayName: userProfile.displayName,
        customerType: customerType,
        companyName: isCompany ? document.getElementById('companyName').value.trim() : '個人戶',
        taxId: isCompany ? document.getElementById('taxId').value.trim() : '個人戶',
        name: document.getElementById('name').value.trim(),
        title: document.getElementById('title').value,
        bizCategories: getCheckedValues('bizCategories').join('、'),
        region: document.getElementById('region').value,
        phone: document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim(),
        subject: document.getElementById('subject').value,
        productName: document.getElementById('productName').value.trim(),
        message: document.getElementById('message').value.trim(),
        subscribe: subscribe,
        subscribeCategories: subscribe === '訂閱' ? getCheckedValues('subscribeCategories').join('、') : '',
      };
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      spinner.style.display = isLoading ? 'inline-block' : 'none';
      submitLabel.textContent = isLoading ? '送出中…' : '送出詢問';
    }

    function showResult(success, message) {
      const screen = document.getElementById('resultScreen');
      const icon = document.getElementById('resultIcon');
      const title = document.getElementById('resultTitle');
      const msg = document.getElementById('resultMessage');
      const retryBtn = document.getElementById('retryBtn');

      screen.className = success ? 'show success' : 'show fail';
      icon.textContent = success ? '✓' : '!';
      title.textContent = success ? '已送出，謝謝！' : '送出失敗';
      msg.textContent = success
        ? '我們已收到您的詢價資訊，專人將於 1-2 個工作天內與您聯繫。'
        : (message || '請稍後再試一次，或直接透過聊天室與我們聯繫。');
      retryBtn.style.display = success ? 'none' : 'inline-block';
    }

    // 人潮多時 Sheet 寫入會排隊，後端排不到鎖會回傳 busy:true（不是資料有誤）。
    // 這裡最多自動重試 2 次，中間才把「送出失敗」顯示給使用者。
    const MAX_AUTO_RETRY = 2;
    const RETRY_DELAY_MS = 1500;

    function attemptSubmit(payload, retriesLeft) {
      // 刻意不設定 Content-Type，讓瀏覽器用預設的 text/plain 送出，
      // 這樣才不會觸發 CORS 預檢請求（Apps Script 沒辦法妥善處理預檢請求）。
      fetch(GAS_ENDPOINT, {
        method: 'POST',
        body: JSON.stringify(payload),
      })
        .then((res) => res.json())
        .then((res) => {
          if (res && res.success) {
            setLoading(false);
            showResult(true);
            return;
          }
          if (res && res.busy && retriesLeft > 0) {
            submitLabel.textContent = '人潮較多，自動重試中…';
            setTimeout(() => attemptSubmit(payload, retriesLeft - 1), RETRY_DELAY_MS);
            return;
          }
          setLoading(false);
          showResult(false, res && res.message);
        })
        .catch((err) => {
          setLoading(false);
          showResult(false, err && err.message);
        });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!validate()) return;

      setLoading(true);
      attemptSubmit(buildPayload(), MAX_AUTO_RETRY);
    });

    document.getElementById('closeBtn').addEventListener('click', function () {
      try {
        if (liff.isInClient()) {
          liff.closeWindow(); // 直接關閉 LIFF 視窗，回到 LINE 聊天室
        } else {
          document.getElementById('resultScreen').classList.remove('show');
        }
      } catch (err) {
        showLiffDebug('關閉視窗失敗', err);
      }
    });

    document.getElementById('retryBtn').addEventListener('click', function () {
      document.getElementById('resultScreen').classList.remove('show');
    });
  </script>
</body>
</html>
